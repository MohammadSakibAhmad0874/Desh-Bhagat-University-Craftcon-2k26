<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mlbb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09182d" />
      <stop offset="50%" stop-color="#142c4c" />
      <stop offset="100%" stop-color="#060e1b" />
    </linearGradient>
    <linearGradient id="cyan-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mlbb-grad)" />
  <!-- MOBA 3-lane Map Grid Motif -->
  <path d="M 100,50 L 700,380" stroke="rgba(0,242,254,0.3)" stroke-width="4"/>
  <path d="M 100,50 Q 400,100 700,380" stroke="rgba(0,242,254,0.15)" stroke-width="3" fill="none"/>
  <path d="M 100,50 Q 400,300 700,380" stroke="rgba(0,242,254,0.15)" stroke-width="3" fill="none"/>
  <!-- Central Crystal Nexus -->
  <g transform="translate(400,200)">
    <polygon points="0,-75 45,-25 0,75 -45,-25" fill="url(#cyan-crystal)" stroke="#ffffff" stroke-width="3"/>
    <polygon points="0,-50 30,-15 0,50 -30,-15" fill="#ffffff" opacity="0.6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="10 8"/>
  </g>
  <!-- Title Badge -->
  <rect x="200" y="325" width="400" height="65" fill="#141420" stroke="#00f2fe" stroke-width="3" rx="4"/>
  <text x="400" y="365" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="2">MOBILE LEGENDS: BANG BANG</text>
  <text x="400" y="382" font-family="'Silkscreen', monospace" font-size="11" fill="#00f2fe" text-anchor="middle">5v5 MOBA ARENA • 5-PLAYER SQUAD</text>
</svg>
