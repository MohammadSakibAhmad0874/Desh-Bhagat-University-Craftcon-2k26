<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgmi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b120c" />
      <stop offset="50%" stop-color="#3d1e08" />
      <stop offset="100%" stop-color="#0d0906" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,183,3,0.08)" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgmi-grad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <!-- Tactical Map Radar Circle -->
  <circle cx="400" cy="225" r="180" fill="none" stroke="rgba(251,133,0,0.25)" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="400" cy="225" r="120" fill="none" stroke="rgba(255,183,3,0.15)" stroke-width="2"/>
  <circle cx="400" cy="225" r="60" fill="none" stroke="rgba(255,183,3,0.3)" stroke-width="2"/>
  <line x1="220" y1="225" x2="580" y2="225" stroke="rgba(251,133,0,0.2)" stroke-width="2"/>
  <line x1="400" y1="45" x2="400" y2="405" stroke="rgba(251,133,0,0.2)" stroke-width="2"/>
  <!-- Supply Crate voxel shape -->
  <g transform="translate(400,200)">
    <polygon points="-70,-40 0,-75 70,-40 0,-5" fill="#d62828" stroke="#f77f00" stroke-width="3"/>
    <polygon points="-70,-40 0,-5 0,65 -70,30" fill="#003049" stroke="#f77f00" stroke-width="3"/>
    <polygon points="0,-5 70,-40 70,30 0,65" fill="#002135" stroke="#f77f00" stroke-width="3"/>
    <!-- Yellow strap -->
    <polygon points="-25,-20 0,-5 25,-20 0,-35" fill="#fcbf49"/>
  </g>
  <!-- Smoke Particles -->
  <circle cx="340" cy="140" r="30" fill="rgba(247,127,0,0.25)" />
  <circle cx="460" cy="150" r="35" fill="rgba(214,40,40,0.25)" />
  <!-- Title Badge -->
  <rect x="230" y="325" width="340" height="65" fill="#141420" stroke="#f5a623" stroke-width="3" rx="4"/>
  <text x="400" y="365" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">BGMI</text>
  <text x="400" y="382" font-family="'Silkscreen', monospace" font-size="11" fill="#f5a623" text-anchor="middle">BATTLEGROUNDS MOBILE INDIA • 4v4 SQUAD</text>
</svg>
