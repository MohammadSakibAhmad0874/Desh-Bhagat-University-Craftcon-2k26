<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="carrom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a0e" />
      <stop offset="50%" stop-color="#4d2f19" />
      <stop offset="100%" stop-color="#180e07" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#carrom-grad)" />
  <!-- Carrom Board Frame -->
  <g transform="translate(400,180)">
    <rect x="-130" y="-90" width="260" height="180" fill="#f4a261" stroke="#582f0e" stroke-width="12" rx="10"/>
    <circle cx="-100" cy="-60" r="14" fill="#1c1917"/>
    <circle cx="100" cy="-60" r="14" fill="#1c1917"/>
    <circle cx="-100" cy="60" r="14" fill="#1c1917"/>
    <circle cx="100" cy="60" r="14" fill="#1c1917"/>
    <!-- Center Circle & Queen -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#e63946" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#e63946" stroke="#ffffff" stroke-width="2"/>
    <!-- Striker -->
    <circle cx="35" cy="25" r="15" fill="#3a86ef" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-20" cy="-15" r="8" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <circle cx="-10" cy="15" r="8" fill="#1c1917" stroke="#ffffff" stroke-width="1"/>
  </g>
  <!-- Title Badge -->
  <rect x="220" y="325" width="360" height="65" fill="#141420" stroke="#f4a261" stroke-width="3" rx="4"/>
  <text x="400" y="365" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">CARROM STRIKE</text>
  <text x="400" y="382" font-family="'Silkscreen', monospace" font-size="11" fill="#f4a261" text-anchor="middle">OFFLINE BOARD TOURNAMENT • SOLO PLAY</text>
</svg>
