      <stop offset="0%" stop-color="#210502" />
      <stop offset="50%" stop-color="#4d0e06" />
      <stop offset="100%" stop-color="#120201" />
    </linearGradient>
    <radialGradient id="fire-glow" cx="50%" cy="50%" r="50%">
