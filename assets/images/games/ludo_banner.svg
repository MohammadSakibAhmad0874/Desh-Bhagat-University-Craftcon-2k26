<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ludo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e2b" />
      <stop offset="50%" stop-color="#2d174d" />
      <stop offset="100%" stop-color="#0f071c" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ludo-grad)" />
  <!-- Ludo Board Quadrants -->
  <g transform="translate(400,190)">
    <!-- Red Quad -->
    <rect x="-120" y="-120" width="100" height="100" fill="#e63946" rx="8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-70" cy="-70" r="25" fill="#ffffff"/>
    <circle cx="-70" cy="-70" r="14" fill="#e63946"/>
    <!-- Green Quad -->
    <rect x="20" y="-120" width="100" height="100" fill="#2a9d8f" rx="8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="70" cy="-70" r="25" fill="#ffffff"/>
    <circle cx="70" cy="-70" r="14" fill="#2a9d8f"/>
    <!-- Yellow Quad -->
    <rect x="20" y="20" width="100" height="100" fill="#e9c46a" rx="8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="70" cy="70" r="25" fill="#ffffff"/>
    <circle cx="70" cy="70" r="14" fill="#e9c46a"/>
    <!-- Blue Quad -->
    <rect x="-120" y="20" width="100" height="100" fill="#457b9d" rx="8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-70" cy="70" r="25" fill="#ffffff"/>
    <circle cx="-70" cy="70" r="14" fill="#457b9d"/>
    <!-- Center Dice -->
    <rect x="-20" y="-20" width="40" height="40" fill="#ffffff" rx="6" stroke="#1d3557" stroke-width="3"/>
    <circle cx="-10" cy="-10" r="4" fill="#e63946"/>
    <circle cx="10" cy="10" r="4" fill="#e63946"/>
    <circle cx="0" cy="0" r="4" fill="#e63946"/>
  </g>
  <!-- Title Badge -->
  <rect x="230" y="325" width="340" height="65" fill="#141420" stroke="#e9c46a" stroke-width="3" rx="4"/>
  <text x="400" y="365" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">LUDO KING</text>
  <text x="400" y="382" font-family="'Silkscreen', monospace" font-size="11" fill="#e9c46a" text-anchor="middle">OFFLINE BOARD ARENA • SOLO PLAY</text>
</svg>
